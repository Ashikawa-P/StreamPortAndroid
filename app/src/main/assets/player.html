<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>StreamPort</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #101216;
      color: #e7eaf0;
    }

    body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: max(12px, env(safe-area-inset-top))
               12px
               max(12px, env(safe-area-inset-bottom));
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 11px;
      border: 1px solid #4b5260;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 15px;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: #6ea8fe;
      color: #08111f;
      font-weight: 700;
      font-size: 15px;
    }

    button:disabled { opacity: .55; }

    #status {
      min-height: 22px;
      margin: 0;
      color: #cbd2dd;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    body.native-pip {
      padding: 0;
      gap: 0;
      overflow: hidden;
    }

    body.native-pip .controls,
    body.native-pip #status {
      display: none;
    }

    body.native-pip video {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      min-height: 0;
      border-radius: 0;
    }

    video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 130px);
      flex: 1;
      min-height: 220px;
      background: #000;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <input
      id="url"
      inputmode="url"
      autocomplete="off"
      placeholder="https://www.skill-capped.com/lol/commentaries/16s0w06b7k">
    <button id="streamButton" type="button">Stream</button>
  </div>

  <p id="status">Bereit</p>
  <video id="video" controls autoplay playsinline crossorigin="anonymous"></video>

  <!-- Deliberately the same playback library and model as the working HTML. -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const CDN_ROOT = "https://d13z5uuzt1wkbz.cloudfront.net";
    const rgx = /([a-z0-9]{10})(:?\/|$)/g;

    const input = document.getElementById("url");
    const button = document.getElementById("streamButton");
    const statusLabel = document.getElementById("status");
    const video = document.getElementById("video");

    let hls = null;

    function notifyAndroidPlayback(eventName) {
      if (!window.AndroidPlayback) {
        return;
      }

      try {
        if (eventName === "play") {
          AndroidPlayback.onPlay();
        } else if (eventName === "pause") {
          AndroidPlayback.onPause();
        } else if (eventName === "ended") {
          AndroidPlayback.onEnded();
        }
      } catch (_error) {
        // The same HTML remains usable in a normal desktop browser.
      }
    }

    window.setNativePipMode = function (enabled) {
      document.body.classList.toggle("native-pip", Boolean(enabled));
    };

    video.addEventListener("play", function () {
      notifyAndroidPlayback("play");
    });

    video.addEventListener("playing", function () {
      notifyAndroidPlayback("play");
    });

    video.addEventListener("pause", function () {
      notifyAndroidPlayback("pause");
    });

    video.addEventListener("ended", function () {
      notifyAndroidPlayback("ended");
    });

    function setStatus(text) {
      statusLabel.textContent = text;
    }

    function createHls() {
      if (!window.Hls || !Hls.isSupported()) {
        throw new Error(
          "hls.js wird von dieser Android-WebView nicht unterstützt. " +
          "Aktualisiere Android System WebView beziehungsweise Chrome."
        );
      }

      if (hls) {
        hls.destroy();
      }

      hls = new Hls({
        maxBufferSize: 0,
        maxBufferLength: 30,
        startPosition: 0
      });

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        setStatus("Manifest geladen. Wiedergabe startet …");
        video.play().catch(function (error) {
          setStatus("Play wurde blockiert: " + error.message);
        });
      });

      hls.on(Hls.Events.ERROR, function (_event, data) {
        const code = data && data.response ? data.response.code : "";
        const url = data && data.url ? data.url : "";
        const reason = data && (data.reason || data.details || data.type)
          ? (data.reason || data.details || data.type)
          : "Unbekannter hls.js-Fehler";

        if (data && data.fatal) {
          notifyAndroidPlayback("ended");
        }

        setStatus(
          "Wiedergabefehler" +
          (code ? " HTTP " + code : "") +
          ": " + reason +
          (url ? " — " + url : "")
        );
      });

      hls.attachMedia(video);
    }

    async function stream() {
      button.disabled = true;

      try {
        createHls();

        const rawUrl = input.value.trim();
        rgx.lastIndex = 0;

        const ids = [];
        let match = null;

        while ((match = rgx.exec(rawUrl)) !== null) {
          ids.push(match[1]);
        }

        if (ids.length < 1) {
          throw new Error("Ungültige URL: keine zehnstellige Video-ID gefunden.");
        }

        const videoId = rawUrl.includes("browse3")
          ? ids[0]
          : ids[ids.length - 1];

        let last = 0;
        let jump = true;

        /*
         * This is intentionally the original HTML algorithm:
         * - probe with HEAD only;
         * - jump downward in blocks of 50 while still above the video end;
         * - once an existing anchor is found, move upward one by one;
         * - a 403 marks the first missing segment;
         * - build the finished playlist from segment 0 through "last".
         */
        for (let i = 300; i <= 1000; i++) {
          if (i === 1000) {
            throw new Error("Das letzte Segment wurde bis 1000 nicht gefunden.");
          }

          if (i === 0) {
            i = 1;
          }

          const segmentUrl =
            CDN_ROOT + "/" + videoId + "/HIDDEN4500-" +
            String(i).padStart(5, "0") + ".ts";

          setStatus("Suche letztes Segment; prüfe " + i + " …");

          const response = await fetch(segmentUrl, {
            method: "HEAD",
            cache: "no-store",
            credentials: "omit"
          });

          if (response.status === 403 || response.status === 404) {
            if (i >= 50 && i % 50 === 0 && jump) {
              last = i;
              jump = true;
              i -= 51;
              continue;
            }
            break;
          }

          if (!response.ok) {
            throw new Error(
              "Segmentprüfung fehlgeschlagen: HTTP " +
              response.status + " bei Segment " + i
            );
          }

          last = i;
          jump = false;
        }

        let playlist =
          "#EXTM3U\n" +
          "#EXT-X-PLAYLIST-TYPE:VOD\n" +
          "#EXT-X-TARGETDURATION:10\n";

        for (let i = 0; i <= last; i++) {
          playlist +=
            "#EXTINF:10,\n" +
            CDN_ROOT + "/" + videoId + "/HIDDEN4500-" +
            String(i).padStart(5, "0") + ".ts\n";
        }

        setStatus(
          "Gefunden: " + (last + 1) +
          " Segmente (0–" + last + "). Lade Stream …"
        );

        hls.loadSource(
          "data:application/x-mpegURL;base64," + btoa(playlist)
        );
      } catch (error) {
        setStatus("Fehler: " + (error && error.message ? error.message : error));
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", stream);
    input.addEventListener("keyup", function (event) {
      if (event.key === "Enter") {
        stream();
      }
    });
  </script>
</body>
</html>
