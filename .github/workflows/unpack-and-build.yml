name: Fix imports and build APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-and-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix ExoPlayer datasource imports
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/src/main/java/de/gabriel/streamport/MainActivity.java'
          test -f "$FILE"

          sed -i             's/com\.google\.android\.exoplayer2\.datasource\.DefaultDataSource/com.google.android.exoplayer2.upstream.DefaultDataSource/'             "$FILE"
          sed -i             's/com\.google\.android\.exoplayer2\.datasource\.DefaultHttpDataSource/com.google.android.exoplayer2.upstream.DefaultHttpDataSource/'             "$FILE"

          grep -q 'com.google.android.exoplayer2.upstream.DefaultDataSource' "$FILE"
          grep -q 'com.google.android.exoplayer2.upstream.DefaultHttpDataSource' "$FILE"

      - name: Commit corrected imports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/de/gabriel/streamport/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'Fix ExoPlayer datasource imports'
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk StreamPort-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPort-APK
          path: StreamPort-v1.2.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          
