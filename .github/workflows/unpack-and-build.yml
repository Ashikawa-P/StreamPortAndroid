name: Unpack project and build APK

on:
  push:
    branches: [main]
    paths:
      - 'StreamPortAndroid_GitHubBuild.zip'
      - '.github/workflows/unpack-and-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack project into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP='StreamPortAndroid_GitHubBuild.zip'
          ROOT='StreamPortAndroid_GitHubBuild'

          test -f "$ZIP"
          rm -rf .unpacked
          mkdir .unpacked
          unzip -q "$ZIP" -d .unpacked
          test -d ".unpacked/$ROOT"

          cp -a ".unpacked/$ROOT/." ./
          rm -rf .unpacked "$ZIP"
          rm -f .github/workflows/unpack-and-build.yml

      - name: Commit unpacked project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Unpack Android project'
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk StreamPort-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPort-APK
          path: StreamPort-v1.2.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
