name: Build StreamPort APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'StreamPortAndroid_v1.3_FIXED.zip'
      - '.github/workflows/build-streamport-apk.yml'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select or unpack Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          FIXED_ZIP="$GITHUB_WORKSPACE/StreamPortAndroid_v1.3_FIXED.zip"

          if [[ -f "$FIXED_ZIP" ]]; then
            DEST="$RUNNER_TEMP/streamport-project"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            unzip -q "$FIXED_ZIP" -d "$DEST"

            SETTINGS_FILE="$(find "$DEST" -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "No settings.gradle.kts found inside $FIXED_ZIP" >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          elif [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" \
               && -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "Upload StreamPortAndroid_v1.3_FIXED.zip or commit the unpacked project." >&2
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building project from: $PROJECT_DIR"

      - name: Verify playback fix is present
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.project.outputs.dir }}/app/src/main/java/de/gabriel/streamport/MainActivity.java"

          grep -q 'upstream.DefaultDataSource' "$FILE"
          grep -q 'upstream.DefaultHttpDataSource' "$FILE"
          grep -q 'for (int index = firstSegment; index <= lastSegment; index++)' "$FILE"
          grep -q 'connection.setRequestProperty("Origin", SITE_ORIGIN)' "$FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/StreamPort-v1.3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPort-APK-v1.3
          path: StreamPort-v1.3.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
