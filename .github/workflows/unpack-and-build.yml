name: Build StreamPort APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'StreamPortAndroid_v2.2_BACKGROUND.zip'
      - '.github/workflows/build-streamport-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/StreamPortAndroid_v2.2_BACKGROUND.zip"
          test -f "$ZIP"

          DEST="$RUNNER_TEMP/streamport-project"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          SETTINGS_FILE="$(find "$DEST" -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "No settings.gradle.kts found inside $ZIP" >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building project from: $PROJECT_DIR"

      - name: Verify streaming fullscreen and background playback
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          JAVA="$PROJECT/app/src/main/java/de/gabriel/streamport/MainActivity.java"
          SERVICE="$PROJECT/app/src/main/java/de/gabriel/streamport/PlaybackKeepAliveService.java"
          HTML="$PROJECT/app/src/main/assets/player.html"
          MANIFEST="$PROJECT/app/src/main/AndroidManifest.xml"

          # Proven streaming and fullscreen path
          grep -q 'shouldInterceptRequest' "$JAVA"
          grep -q 'Access-Control-Allow-Origin' "$JAVA"
          grep -q 'onShowCustomView' "$JAVA"
          grep -q 'method: "HEAD"' "$HTML"
          grep -q 'hls.loadSource' "$HTML"

          # New background playback path
          grep -q 'addJavascriptInterface' "$JAVA"
          grep -q 'startForegroundService' "$JAVA"
          grep -q 'setAutoEnterEnabled' "$JAVA"
          grep -q 'onPictureInPictureModeChanged' "$JAVA"
          grep -q 'AndroidPlayback.onPlay' "$HTML"
          grep -q 'AndroidPlayback.onPause' "$HTML"
          grep -q 'PARTIAL_WAKE_LOCK' "$SERVICE"
          grep -q 'WIFI_MODE_FULL_HIGH_PERF' "$SERVICE"
          grep -q 'FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK' "$SERVICE"
          grep -q 'foregroundServiceType="mediaPlayback"' "$MANIFEST"
          grep -q 'supportsPictureInPicture="true"' "$MANIFEST"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/StreamPort-v2.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPort-APK-v2.2
          path: StreamPort-v2.2.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          
